# MARK:- Plex
  # LAN-only, deliberately not on caddy-net -- doesn't need Tailscale/Caddy.
  plex:
    image: lscr.io/linuxserver/plex:latest
    container_name: plex
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
      # Only needed on first run to link this server to your Plex account --
      # get a fresh one from https://plex.tv/claim (expires in ~4 minutes),
      # then remove this line once the server shows up as claimed.
      - PLEX_CLAIM=${PLEX_CLAIM_TOKEN}
      - ADVERTISE_IP=${ADVERTISE_IP}
      - VERSION=docker
    ports:
      - "32400:32400/tcp"
      - "32410:32410/udp"
      - "32412:32412/udp"
      - "32413:32413/udp"
      - "32414:32414/udp"
      - "32469:32469/tcp"
      - "1900:1900/udp"
    volumes:
      - ./data/plex/config:/config
      - ${PLEX_MOVIES_PATH}:/data/movies:ro
    restart: unless-stopped
    # Uncomment if the Cloud machine has an NVIDIA GPU and you want
    # hardware-accelerated transcoding (requires Plex Pass to activate):
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # MARK:- Portainer
  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    networks:
      - caddy-net
    environment:
      # Shared secret the Portainer Server must present when connecting --
      # without this, anyone who can reach the tailnet IP on 9001 could
      # attach as if they were the trusted server.
      - AGENT_SECRET=${PORTAINER_AGENT_SECRET}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data/portainer:/data
    restart: unless-stopped

networks:
  gitea-net:
    driver: bridge
  caddy-net:
    driver: bridge
  pocketid-net:
    driver: bridge
  immich-net:
    driver: bridge
